<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lo Squalo - Tenerife Experience</title>
    <meta name="description" content="Accommodation, excursions, surfing, events and agency services in Tenerife. Lo Squalo — your hub on the island since 2009.">
    <link rel="stylesheet" href="/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="canonical" href="https://losqualotenerife.com/en/index.html">
    <link rel="alternate" hreflang="it" href="https://losqualotenerife.com/index.html">
    <link rel="alternate" hreflang="en" href="https://losqualotenerife.com/en/index.html">
    <link rel="alternate" hreflang="es" href="https://losqualotenerife.com/es/index.html">
    <link rel="alternate" hreflang="x-default" href="https://losqualotenerife.com/index.html">
</head>
<body>
    <div class="container">
        <header>
            <a href="index.html" class="logo-link" aria-label="Lo Squalo">
                <span class="logo-mark"></span>
            </a>
            <span class="tagline">&copy; since 2009</span>
        </header>

        <main class="mind-map" data-state="initial">
            <!-- SVG per le linee dinamiche -->
            <svg class="connections" id="svg-connections">
                <!-- Linee principali: Tenerife -> Categorie -->
                <line class="line main-line" id="line-tenerife-eventi"></line>
                <line class="line main-line" id="line-tenerife-alloggio"></line>
                <line class="line main-line" id="line-tenerife-escursioni"></line>
                <line class="line main-line" id="line-tenerife-surfing"></line>
                <line class="line main-line" id="line-tenerife-agency"></line>
                <line class="line main-line" id="line-tenerife-alessandro"></line>
            </svg>

            <!-- Centro - Tenerife -->
            <div class="center-node" id="tenerife-trigger">
                <img loading="lazy" decoding="async" src="/tenerife.png" alt="Tenerife" class="tenerife-img">
                <span class="explore-btn">Tenerife Experience</span>
                <span class="click-hint">Click to explore</span>
                <span class="explore-prompt">What are you looking for?</span>
            </div>

            <!-- ===== 6 CATEGORIE PRINCIPALI (link diretti) ===== -->
            <div class="primary-nodes">
                <!-- EVENTI - Giallo/Oro -->
                <a href="eventi.html" class="node node-primary eventi" id="node-eventi">
                    <span>EVENTS &amp;<br>PRIVATE SERVICES</span>
                </a>

                <!-- ALLOGGIO - Rosa -->
                <a href="alloggio.html" class="node node-primary alloggio" id="node-alloggio">
                    <span>ACCOMMODATION</span>
                </a>

                <!-- ESCURSIONI & ATTIVITÀ - Verde acqua -->
                <a href="escursioni.html" class="node node-primary escursioni" id="node-escursioni">
                    <span>EXCURSIONS<br>&amp; ACTIVITIES</span>
                </a>

                <!-- SURFING TENERIFE - Blu oceano -->
                <a href="surfing.html" class="node node-primary surfing" id="node-surfing">
                    <span>SURFING<br>TENERIFE</span>
                </a>

                <!-- AGENCY B2B - Blu scuro -->
                <a href="agency.html" class="node node-primary agency" id="node-agency">
                    <span>AGENCY</span>
                </a>

                <!-- ALESSANDRO - Grigio blu -->
                <a href="alessandro.html" class="node node-primary alessandro" id="node-alessandro">
                    <span>ALESSANDRO</span>
                </a>
            </div>

        </main>

        <div class="home-search" id="home-search">
            <input type="text" id="service-search" class="home-search-input" placeholder="Search a service…" autocomplete="off" aria-label="Search a service">
            <ul class="home-search-results" id="search-results" role="listbox"></ul>
        </div>

        <!-- brand.html esiste solo in italiano: link assoluto -->
        <a href="/brand.html" class="brand-button brand-button--center">
            <span class="brand-dot"></span> Brand
        </a>
    </div>

    <script src="/script.js"></script>
    <script src="/search.js"></script>
    <script src="/lang-switch.js"></script>
</body>
</html>
